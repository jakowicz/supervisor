[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-supervisor"
version = "0.1.0"
description = "Evidence-gated LangGraph task supervisor."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<2",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
supervisor-run = "supervisor.cli:main"
supervisor-reports = "supervisor.reports_cli:main"
supervisor-dashboard = "supervisor.dashboard:main"
supervisor-observability-import = "supervisor.observability_import:main"
supervisor = "supervisor.manage:main"

[tool.setuptools.packages.find]
include = ["supervisor*"]

[tool.setuptools.package-data]
supervisor = ["env_migrations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
